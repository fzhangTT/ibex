# gen: riscv-dv testlist for the generated TB's own target (dv/auto_dv/stim/gen_riscv_dv_target).
# riscv-dv reads it as testlist.yaml from the fixed-name target dir gen_program.py materializes.
# Format: vendor/google_riscv-dv/yaml/base_testlist.yaml header. The TB flow uses only the gen
# step of run.py; assembly/linking is done by the team flow with gen_link.ld and $RISCV_GCC.
- test: gen_rand_smoke
  description: >
    Small random program for the stimulus toolchain proof: integer, M, compressed and ratified
    Zba/Zbb/Zbc/Zbs instructions; M-mode boot; vectored mtvec aligned to 256 bytes (Ibex forces
    MODE=01 and BASE[7:2]=0); PMP programmed by the generator; no sub-programs.
  iterations: 1
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=300
    +num_of_sub_program=0
    +boot_mode=m
    +no_wfi=1
    +tvec_alignment=8
    +enable_zba_extension=1
    +enable_zbb_extension=1
    +enable_zbc_extension=1
    +enable_zbs_extension=1
    +pmp_num_regions=16
    +pmp_granularity=0
    +num_debug_sub_program=0
  rtl_test: gen_none
# Debug ROM budget: gen_link.ld places the relocated riscv-dv debug ROM in the DM window
# (DmHaltAddr .. DmBaseAddr+DmAddrMask, 0x800 bytes; gen_program.py checks the linked size). A
# seed-7 ROM with +gen_debug_section=1 +num_debug_sub_program=1 measured 0x6d4 bytes (1748) in the T-036 re-proof: keep
# +num_debug_sub_program at 0 or 1 and do not raise the debug program length knobs above their
# defaults for generated tests; larger debug programs are directed tests.
