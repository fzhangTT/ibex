# Team regression testlist (owner: runtime; test entries are added by the Test Writer, build
# entries by TB Infra through the runtime owner). Schema: dv/auto_dv/docs/gen_runtime_api.md.
#
# builds.<name>: one VCS compile.
#   tb_top         compile top module (-top)
#   dut_instance   instance name of gen_dut_top inside tb_top (coverage scope: tb_top.dut_instance)
#   filelists      VCS -f files, clone-root relative, in order
#   defines        +define+ names added to the SIM_RECIPE Section 2 set
#   cocotb         true = add the Section 4 cocotb triple at compile time
#   extra_vcs_args optional extra compile arguments
#
# tests[]: one entry per test; the flow runs it as <build>/vcs_simv with the plusargs below.
#   name                   gen_ prefixed, unique; also the fcov manifest and cm_name key
#   description            one line
#   tier                   smoke | targeted | full (a test is in its tier and every higher tier), or
#                          check: build/elaboration checks outside the measured tiers (--tier check
#                          or by name only; must be measured: false; Critic R-01)
#   build                  key into builds
#   uvm_test               value of +UVM_TESTNAME (null = the TB top has no UVM test class)
#   plusargs               list of "+name=value" strings from the testlist entry
#   seeds                  count (seeds derived from --base-seed per test) or explicit list
#   program                optional program step before the run (gen_runtime_api.md 7e): exactly one of
#                          riscv_dv_test | directed: [<clone-relative .S>...] | generator: <clone-relative
#                          per-seed script> (+ generator_args), with seed: run | <int>, extra_args, spike_check
#   fcov_expectation_file  dv/auto_dv/fcov_expectations/<name>.fcov.yaml (a measured entry), a manifest in that directory
#                          (an unmeasured entry may name its group's), or null; the loader refuses any other value
#   timeout_s              per-run wall-clock budget of the simulation process
#   owner                  role slug
#   pass_marker            log line that proves the end of test was reached (null = "$finish")
#   feature_groups         tags for the targeted tier (--group)
#   cocotb_module          dotted Python module for cocotb-driven tests (null = pure SV)
#   expected_fail          true = an RTL-vs-intent bug candidate; FAIL is reported as XFAIL
#   red_fixture            true = a TDD red fixture that fails by design; a FAIL whose collected evidence
#                          line matches red_expect is reported as RED-OK, any other FAIL stays FAIL
#                          (undeclared reason), an unexpected PASS is FAIL; kept out of the pass rate
#                          and of coverage (must be measured: false; exclusive with expected_fail)
#   red_expect             regex of the designed failure's evidence line (required with red_fixture)
#   keep_artifacts         true = a purpose-4 regression keeps this test's export file on PASS / RED-OK
#                          runs (default: pruned after the manifest, paths recorded in result.yaml)
#   component              TB component this test exercises (purpose-2 selection)
#   measured               default true; false = mutation-evidence or forced-error test that never
#                          enters a measured coverage merge (separate vdb tree, Critic ruling R-5.5)
schema_version: 1

# Policies (flow-enforced):
#   fcov_manifest_required_tiers: tiers whose MEASURED tests must carry an fcov_expectation_file (a null
#     manifest there FAILs the run at merge time; Critic P-07); an entry with measured: false contributes no
#     coverage and is exempt, as is tier check.
#   debug_only_plusargs: knob names that never run in a measured coverage run (tb-arch P6: probe
#     P6, the CSR debug compare); a measured run enabling one is refused in writing (NOT_RUN).
#     The one origin of the property and of the names is TB Infra's rendered knob table
#     dv/auto_dv/gen_tb/gen_knobs.py (PLUSARGS[...]['debug_only']); load_testlist refuses this
#     list unless it equals that set.
#   red_expect_policy: [fire_id] = a red_expect that matches the GEN_TEST_FAIL harness line (the prefix
#     anywhere in the regex) must name the designed fire_ id (the harness prints it on that line; a
#     generic signature would accept any fixture failure); the loader refuses the file otherwise.
#     Non-harness signatures (the UVM_ERROR class of gen_ut_lockstep_forced_red) are outside it.
fcov_manifest_required_tiers: [smoke, targeted]
debug_only_plusargs: [gen_dbg_csr_probe, gen_rvfi_trace, gen_isa_string, gen_isa_log, gen_sb_trace, gen_export_flush_every]
red_expect_policy: [fire_id]

builds:
  gen_smoke:
    description: gen_smoke_tb_top around gen_dut_top, pure SV, opentitan configuration
    tb_top: gen_smoke_tb_top
    dut_instance: u_dut
    # DV Lead ruling (gen_tb_architecture.md Section 5): the gate numbers are the two inner instances
    # combined; the wrapper is instrumented and reported informationally, never gated.
    cov_trees: [u_dut.u_ibex_core, u_dut.u_register_file]
    info_trees: [u_dut]
    filelists:
      - dv/auto_dv/tb/gen_rtl.f
      - dv/auto_dv/tb/gen_smoke_tb.f
    defines:
      - RVFI
    cocotb: false
    # DV Lead ruling LOG-007/008: every measured build filters zero-time glitch hits (FSM excepted by VCS).
    extra_vcs_args: ["-cm_glitch", "0"]
  gen_smoke_cocotb:
    description: gen_smoke_tb_top with the SIM_RECIPE Section 4 cocotb triple (VPI library from the shared mirror venv)
    tb_top: gen_smoke_tb_top
    dut_instance: u_dut
    cov_trees: [u_dut.u_ibex_core, u_dut.u_register_file]
    info_trees: [u_dut]
    filelists:
      - dv/auto_dv/tb/gen_rtl.f
      - dv/auto_dv/tb/gen_smoke_tb.f
    defines:
      - RVFI
    cocotb: true
    extra_vcs_args: ["-cm_glitch", "0"]

  gen_tb:
    description: gen_tb_top around gen_dut_top (opentitan configuration), UVM env + cocotb bridge, bus agents, icache RAM models, scramble-key responder (TB Infra entry, dv/auto_dv/work/tb-infra/gen_runtime_build_entry_gen_tb.yaml)
    tb_top: gen_tb_top
    dut_instance: u_dut
    cov_trees: [u_dut.u_ibex_core, u_dut.u_register_file]
    info_trees: [u_dut]
    filelists:
      - dv/auto_dv/tb/gen_rtl.f
      - dv/auto_dv/tb/gen_tb.f
    defines:
      - RVFI
    cocotb: true
    extra_vcs_args: ["-cm_glitch", "0"]
    # ISA shim (Spike behind DPI) as a shared library next to the simv (TB Infra, dv/auto_dv/isa).
    pre_build:
      - bash dv/auto_dv/isa/gen_isa_shim_build.sh lib {outdir}/lib
    extra_ldflags: ["-L{outdir}/lib", "-lgen_isa_shim", "-Wl,-rpath,{outdir}/lib", "-Wl,-rpath-link,{mirror}/tools/spike/lib"]
    # Run-time library search path of every run: the shim beside the simv and the mirror's spike
    # (-rpath-link above serves the link step only; LSF hosts see the mirror, never the clone).
    runtime_lib_dirs: ["{outdir}/lib", "{mirror}/tools/spike/lib"]

tests:
  - name: gen_smoke
    description: build/elaboration check (not a regression test); NOP program, checks retirement and no alert
    tier: check
    build: gen_smoke
    uvm_test: null
    plusargs:
      - +gen_smoke_cycles=3000
    seeds: 1
    fcov_expectation_file: null
    timeout_s: 600
    owner: tb-infra
    pass_marker: GEN_SMOKE_PASS
    feature_groups: [bringup]
    cocotb_module: null
    expected_fail: false
    component: gen_dut_top
    measured: false

  - name: gen_cocotb_probe
    description: flow probe; cocotb loads on the LSF host from the shared mirror, observes RVFI retirements from Python
    tier: check
    build: gen_smoke_cocotb
    uvm_test: null
    plusargs:
      - +gen_smoke_cycles=3000
    seeds: 1
    fcov_expectation_file: null
    timeout_s: 600
    owner: runtime
    pass_marker: GEN_COCOTB_PROBE_PASS
    feature_groups: [flow, cocotb]
    cocotb_module: dv.auto_dv.flow.gen_cocotb_probe
    expected_fail: false
    component: flow
    measured: false

  - name: gen_ut_bridge
    description: TB self-test of the cocotb bridge (commands, thresholds, finish handshake); no program (TB Infra)
    tier: check
    build: gen_tb
    uvm_test: gen_base_test
    plusargs: []
    seeds: 1
    fcov_expectation_file: null
    timeout_s: 600
    owner: tb-infra
    pass_marker: GEN_UT_BRIDGE_PASS
    feature_groups: [bringup, tb]
    cocotb_module: dv.auto_dv.gen_tb.gen_tests.gen_ut_bridge
    expected_fail: false
    component: gen_bridge
    measured: false

  - name: gen_boot_zc
    description: boots-and-retires milestone on the directed Zc program (image digest, MEM_PEEK read-back, retirement threshold, tohost pass code); TB mechanics only (TB Infra)
    tier: smoke
    build: gen_tb
    uvm_test: gen_base_test
    # The image plusargs (+gen_mem_image, +gen_mem_image_crc32, +gen_mem_image_words, +gen_boot_addr,
    # +gen_tohost_addr) are added by the flow from gen_image.GenImage(<vmem>).plusargs() of the program.
    plusargs:
      - +gen_fetch_en_at_reset=0
      - +gen_ut_boot_retire=100
    program:
      directed: [dv/auto_dv/stim/gen_directed/gen_zc_directed.S]
      seed: 1
    seeds: 1
    fcov_expectation_file: null
    timeout_s: 900
    owner: tb-infra
    pass_marker: GEN_UT_BOOT_PASS
    feature_groups: [bringup]
    cocotb_module: dv.auto_dv.gen_tb.gen_tests.gen_ut_boot
    expected_fail: false
    component: gen_tb_top
    measured: false   # canary of the flow, no plan items: its coverage is never counted

  - name: gen_ut_lockstep
    description: lock-step comparator (Spike ISA shim vs RVFI retirement) on the directed Zc program; checks the DUT against the model (TB Infra)
    tier: smoke
    build: gen_tb
    uvm_test: gen_base_test
    plusargs:
      - +gen_fetch_en_at_reset=0
      - +gen_ut_boot_retire=100
    program:
      directed: [dv/auto_dv/stim/gen_directed/gen_zc_directed.S]
      seed: 1
    seeds: 1
    fcov_expectation_file: null
    timeout_s: 900
    owner: tb-infra
    pass_marker: GEN_UT_LOCKSTEP_PASS
    feature_groups: [bringup, isa_model]
    cocotb_module: dv.auto_dv.gen_tb.gen_tests.gen_ut_lockstep
    expected_fail: false
    component: gen_isa_shim
    measured: false   # TB lock-step check without an fcov manifest (LOG-039): unmeasured by kind

  - name: gen_ut_lockstep_forced_red
    description: forced red of the lock-step comparator (TB Infra T-068) with the model ISA string overridden to plain rv32imc, so every Zc retirement mismatches; a red fixture, recorded RED-OK (an unexpected PASS is FAIL); never in a measured tier
    tier: check
    build: gen_tb
    uvm_test: gen_base_test
    plusargs:
      - +gen_fetch_en_at_reset=0
      - +gen_ut_boot_retire=100
      - +gen_isa_string=rv32imc_zicsr_zifencei
    program:
      directed: [dv/auto_dv/stim/gen_directed/gen_zc_directed.S]
      seed: 1
    seeds: 1
    fcov_expectation_file: null
    timeout_s: 900
    owner: tb-infra
    pass_marker: GEN_UT_LOCKSTEP_PASS
    feature_groups: [bringup, isa_model, red]
    cocotb_module: dv.auto_dv.gen_tb.gen_tests.gen_ut_lockstep
    expected_fail: false
    red_fixture: true
    red_expect: 'UVM_ERROR .*\[isa_[a-z_]+\]'
    component: gen_isa_shim
    measured: false

  - name: gen_ut_export
    description: Record export unit test (TB Infra T-080) with two EXPORT_FLUSH commands, read(seq) bound to the second, header/count/order/cycle rules, first-record pc, tohost stores, pc continuity (trap, mret, dret excluded per C-1)
    tier: check
    build: gen_tb
    uvm_test: gen_base_test
    plusargs:
      - +gen_fetch_en_at_reset=0
      - +gen_ut_boot_retire=100
      - +gen_export_file=gen_export.txt
    program:
      directed: [dv/auto_dv/stim/gen_directed/gen_zc_directed.S]
      seed: 1
    seeds: 1
    fcov_expectation_file: null
    timeout_s: 300
    owner: tb-infra
    pass_marker: GEN_UT_EXPORT_PASS
    feature_groups: []
    cocotb_module: dv.auto_dv.gen_tb.gen_tests.gen_ut_export
    expected_fail: false
    component: gen_export_sink
    measured: false

  - name: gen_ut_export_counters
    description: Record export unit test with counters (TB Infra T-080, +gen_export_counters=1) with two EXPORT_FLUSH commands, read(seq) bound to the second, header/count/order/cycle rules, first-record pc, tohost stores, pc continuity (trap, mret, dret excluded per C-1)
    tier: check
    build: gen_tb
    uvm_test: gen_base_test
    plusargs:
      - +gen_fetch_en_at_reset=0
      - +gen_ut_boot_retire=100
      - +gen_export_file=gen_export.txt
      - +gen_export_counters=1
    program:
      directed: [dv/auto_dv/stim/gen_directed/gen_zc_directed.S]
      seed: 1
    seeds: 1
    fcov_expectation_file: null
    timeout_s: 300
    owner: tb-infra
    pass_marker: GEN_UT_EXPORT_PASS
    feature_groups: []
    cocotb_module: dv.auto_dv.gen_tb.gen_tests.gen_ut_export
    expected_fail: false
    component: gen_export_sink
    measured: false

  # Test Writer entries (copied verbatim from dv/auto_dv/work/test-writer/gen_testlist_entries.yaml)
  - name: gen_test_boot_retire
    description: template proof; riscv-dv gen_rand_smoke at the run seed boots, retires past the entry's instr_cnt floor and ends with tohost 1; the timing-only regime knobs are drawn and scheduled from the
      seed only when the build has a REGIME_SET consumer (none at HEAD, logged GEN_TEST_LAYERS not_applied) (Test Writer)
    tier: check
    build: gen_tb
    uvm_test: gen_base_test
    plusargs: [+gen_fetch_en_at_reset=0]
    program: {riscv_dv_test: gen_rand_smoke, seed: run}
    seeds: 3
    fcov_expectation_file: null
    timeout_s: 900
    owner: test-writer
    pass_marker: GEN_TEST_PASS
    feature_groups: [bringup, template]
    cocotb_module: dv.auto_dv.tests.gen_test_boot_retire
    expected_fail: false
    component: gen_tb_top
    measured: false

  - name: gen_test_boot_retire_red
    description: TDD red fixture of gen_test_boot_retire; the directed program ends with tohost 3 and declares an unreachable retirement floor, so the fire-check must FAIL (verdict RED-OK; evidence dv/auto_dv/evidence/gen_tdd_test_template.md);
      never a regression test; the red program ends with tohost 3, so fire_eot_pass_code is the designed first failure (fire_retired_floor follows)
    red_fixture: true
    red_expect: 'GEN_TEST_FAIL gen_test_boot_retire: [0-9]+ fire-check failure\(s\):.*\bfire_eot_pass_code(?!\d)'
    tier: check
    build: gen_tb
    uvm_test: gen_base_test
    plusargs: [+gen_fetch_en_at_reset=0]
    program:
      directed: [dv/auto_dv/tests/gen_programs/gen_boot_retire_red.S]
