# Bridge command kinds (C2): code = 1-based position; 0 is GEN_CMD_NONE. Rendered as GEN_CMD_<K>
# (8-bit) plus gen_cmd_name() in gen_tb_pkg.sv, CMD in gen_knobs.py and GEN_CMD_<K> in the shim header.
bridge_cmds: [IRQ_SET, IRQ_CLR, NMI_PULSE, DBG_REQ, REGIME_SET, KEY_MODE, MEM_ERR_ARM, ICACHE_ECC_ARM, FETCH_EN, MEM_PEEK, MISC, EXPORT_FLUSH, COV_WITNESS]
# CG-WIT-001: the witness bins, one per marked test-plan item, rendered from this CSV (index, tp_item, bin, test_group, marked)
# into gen_wit_bins.svh (gen_fcov_pkg) and the WITNESS_* tables of gen_knobs.py; COV_WITNESS arg0 = index, arg1 = the issuing
# test's group index.
witness_csv: dv/auto_dv/docs/gen_trace_witness_ids.csv

# Numeric meaning of the latency, rate and cap regimes (rendered as gen_regime_window / gen_regime_scalar
# in gen_tb_pkg.sv and REGIME_WINDOWS in gen_knobs.py). Every key must be a value of the knobs that use the
# group (checked at render time). rvalid classes follow gen_fcov_plan.md: min1 {1}, short {2..4}, long {5..};
# gnt classes: d0 {0}, d1..d3 short, d4.. long.
regime_windows:
  gnt_delay:      {same_cycle: [0, 0], short: [1, 3], long: [4, 32], random: [0, 32]}
  rvalid_delay:   {min1: [1, 1], short: [2, 4], long: [5, 32], random: [1, 32]}
  rate_per_mille: {none: 0, rare: 2, frequent: 50}
  outstanding_cap: {cap1: 1, cap2: 2, cap4: 4, cap8: 8}
  # mean cycles between autonomous irq/debug regime events (0 = none), keyed by the regime knobs' values. A held line stays
  # pending until its own entry (UNTIL_TAKEN releases only the taken line), so the storm mean must stay above the core's
  # service cost per entry (about 11 cycles) times the lines per event (up to 4): 20 livelocked the program, 100 keeps an
  # entry every ~30 cycles with the main program progressing.
  irq_event_mean: {quiet: 0, sparse: 2000, storm: 100}
  dbg_event_mean: {none: 0, sparse: 5000, storm: 200}

# Constants: `sv` is the SystemVerilog right-hand side when it must reference ibex_pkg; `value` is the
# integer for Python and C when the value is a literal; `derive` names a renderer derivation that computes
# the Python/C value from rtl/ibex_pkg.sv (the SV side keeps the expression; the renderer also emits a
# `<NAME>_PY` mirror that gen_tb_top compares with the expression at time 0). Order matters for SV.
constants:
  - {name: GEN_ICACHE_NUM_FB, value: 4, sv_type: int unsigned, desc: "icache fill buffers, the one re-typed localparam NUM_FB (rtl/ibex_icache.sv:72)"}
  - {name: GEN_IBUS_MAX_OUTSTANDING, derive: ibus_max_outstanding, sv: "GEN_ICACHE_NUM_FB * ibex_pkg::IC_LINE_BEATS", sv_type: int unsigned, desc: "instruction beats in flight (NUM_FB x IC_LINE_BEATS; rtl-arch T-051 2.3)"}
  - {name: GEN_DBUS_MAX_OUTSTANDING, value: 2, sv_type: int unsigned, desc: "data beats in flight, the two halves of one split access (rtl/ibex_load_store_unit.sv:403-405)"}
  - {name: GEN_CSR_WRITE_TO_RVFI_OFFSET, value: 2, sv_type: int unsigned, desc: "cycles from a CSR-write commit edge to its RVFI record (v3 T-051 2.1, predicted, pinned by a directed test)"}
  - {name: GEN_TRAP_TO_RVFI_OFFSET, value: 1, sv_type: int unsigned, desc: "cycles from a trap/mret/dret commit edge to its RVFI record (v3 T-051 2.1)"}
  - {name: GEN_FETCH_EN_DRAIN_CYCLES, value: 64, sv_type: int unsigned, desc: "cycles after fetch_enable_i leaves On within which the pipeline's in-flight instructions may still retire; a record later than that is a fetch_en failure"}
  - {name: GEN_LSU_TRAP_TO_RVFI_OFFSET, value: 0, sv_type: int unsigned, desc: "cycles from a load/store fault's commit edge to its RVFI record: the fault is seen in WB, so its record and the controller's save edge share a cycle"}
  - {name: GEN_IRQ_MARKER_TO_RVFI_OFFSET, value: 2, sv_type: int unsigned, desc: "cycles from the interrupt entry commit to the rvfi_ext_irq_valid marker (v3 T-051 2.1)"}
  - {name: GEN_RVFI_ID_EXIT_OFFSET, value: 2, sv_type: int unsigned, desc: "cycles from ID exit (rvfi_ext_mcycle sample point, rtl/ibex_core.sv:2102) to the record, plus the WB wait for loads/stores (v3 T-051 2.2)"}
  - {name: GEN_ICACHE_ECC_WINDOW, value: 1, sv_type: int unsigned, desc: "alert_minor_o alone within 1 cycle counted from the lookup request that returns corrupted rdata (v3 T-051 2.4; the invalidation write is not part of the window)"}
  - {name: GEN_IRQ_ENTRY_BOUND_RECORDS, value: 17, sv_type: int unsigned, desc: "records between a pin edge and the interrupt entry, worst case WB + ID + 16 Zcmp micro-ops (v3 T-051 2.6)"}
  - {name: GEN_DBG_ENTRY_BOUND_RECORDS, value: 17, sv_type: int unsigned, desc: "records between debug_req_i and the debug entry, same derivation (v3 T-051 2.6)"}
  - {name: GEN_CLK_PERIOD_NS, value: 10, sv_type: int unsigned, desc: "TB clock period (gen_tb_top ClkHalfPeriodNs = 5); Python converts cycle budgets to ns with it"}
  - {name: GEN_MEM_READBACK_WORDS_DEFAULT, value: 64, sv_type: int unsigned, desc: "default MEM_PEEK read-back sample size (+gen_mem_readback_words)"}
  - {name: GEN_ALIVE_TIMEOUT_CYCLES_DEFAULT, value: 100000, sv_type: int unsigned, desc: "default alive watchdog (+gen_alive_timeout)"}
  - {name: GEN_FINISH_TIMEOUT_CYCLES_DEFAULT, value: 20000, sv_type: int unsigned, desc: "default finish-handshake budget (+gen_finish_timeout)"}
  - {name: GEN_IRQ_FAST_W, derive: irq_fast_w, sv: "$bits(GEN_IRQS_ZERO.irq_fast)", sv_type: int unsigned, desc: "fast interrupt lines (width of ibex_pkg::irqs_t.irq_fast)"}
  - {name: GEN_IRQ_FAST_MASK, derive: irq_fast_mask, sv: "((32'h1 << GEN_IRQ_FAST_W) - 1) << 16", sv_type: "logic [31:0]", desc: "mie/mip fast interrupt bits 16..16+GEN_IRQ_FAST_W-1 (platform-specific interrupts start at bit 16); the shim installs them in gen_mie_csr_t"}
  - {name: GEN_CSR_MARCHID_VALUE, derive: csr_marchid_value, sv: "ibex_pkg::CSR_MARCHID_VALUE", sv_type: "logic [31:0]", desc: "marchid the DUT reports (rtl/ibex_pkg.sv CSR_MARCHID_VALUE); the shim installs it as a read-only CSR"}
  - {name: GEN_CSR_CPUCTRLSTS, derive: csr_addr_cpuctrlsts, sv: "ibex_pkg::CSR_CPUCTRLSTS", sv_type: "logic [11:0]", desc: "custom CSR address cpuctrlsts (rtl/ibex_pkg.sv); the shim's masked CSR with the ic_scr_key_valid status bit"}
  - {name: GEN_CSR_SECURESEED, derive: csr_addr_secureseed, sv: "ibex_pkg::CSR_SECURESEED", sv_type: "logic [11:0]", desc: "custom CSR address secureseed (rtl/ibex_pkg.sv); reads 0 in the shim"}
  - {name: GEN_MHPM_COUNTER_NUM, value: 10, sv_type: int unsigned, desc: "MHPMCounterNum of the build (Runtime's -pvalue; gen_tb_top fatals when u_dut.MHPMCounterNum differs); the shim's mhpmevent values and the counter sync use it"}
  - {name: GEN_INSN_MRET, value: 0x30200073, sv_type: "logic [31:0]", desc: "mret encoding (privileged spec); plan C-1: its RVFI pc_wdata is pc + 4, so isa_pc_next and the export continuity rule skip it"}
  - {name: GEN_INSN_DRET, value: 0x7B200073, sv_type: "logic [31:0]", desc: "dret encoding (debug spec); plan C-1 as for mret"}
  - {name: GEN_TDATA1_IBEX_RDATA, value: 0x28001048, sv_type: "logic [31:0]", desc: "tdata1 read value with execute = 0: type 2, dmode 1, action 1, m and u (rtl/ibex_cs_registers.sv:1848-1864); bit 2 is the stored execute flag; the codegen verifies this literal against the RTL assign at every render"}
  - {name: GEN_CPUCTRLSTS_SYNC_EXC_SEEN_BIT, value: 6, sv_type: int unsigned, desc: "cpuctrlsts.sync_exc_seen bit (cpu_ctrl_sts_part_t, rtl/ibex_cs_registers.sv:239-246); the shim sets and clears it from the model's traps"}
  - {name: GEN_CPUCTRLSTS_DOUBLE_FAULT_SEEN_BIT, value: 7, sv_type: int unsigned, desc: "cpuctrlsts.double_fault_seen bit (cpu_ctrl_sts_part_t, rtl/ibex_cs_registers.sv:239-246)"}
  - {name: GEN_MEM_ERR_ARM_KIND_ERR, value: 1, sv_type: int unsigned, desc: "MEM_ERR_ARM arg3[7:0] kind: bus error response (gen_bus_driver::arm_err)"}
  - {name: GEN_BUS_ERR_LOG_DEPTH, value: 256, sv_type: int unsigned, desc: "TB-local bound of the announced data-bus error queue (gen_bus_err_log), not a DUT property"}
  - {name: GEN_BUS_ERR_DRAIN_CYCLES, value: 64, sv_type: int unsigned, desc: "cycles an announced data-bus error may still await its trap record at the end of the run before the leftover referee counts it: 2 x 32, the two in-order transactions of a split access each waiting the longest rvalid window (regime_windows.rvalid_delay long / random upper bound 32; a longer window must raise it) (response to WB retirement plus the record lag)"}
  - {name: GEN_NMI_INT_ENTRY_BOUND_RECORDS, value: 4, sv_type: int unsigned, desc: "records outside NMI mode within which an injected data-side integrity corruption must produce the internal NMI entry (rtl/ibex_controller.sv:391-430; observed 2-3 on the seed-7 program)"}
  - {name: GEN_MEM_ERR_ARM_KIND_INTG, value: 2, sv_type: int unsigned, desc: "MEM_ERR_ARM arg3[7:0] kind: integrity corruption of the response"}
  - {name: GEN_ISA_FAULT_KIND_FETCH, value: 0, sv_type: int unsigned, desc: "gen_isa_arm_fault kind: instruction fetch (shim fault_hits)"}
  - {name: GEN_ISA_FAULT_KIND_LOAD, value: 1, sv_type: int unsigned, desc: "gen_isa_arm_fault kind: load"}
  - {name: GEN_ISA_FAULT_KIND_STORE, value: 2, sv_type: int unsigned, desc: "gen_isa_arm_fault kind: store"}

# TB memory map (test equipment). DM windows are read from gen_dut_top.sv parameters and the
# program window from gen_riscv_dv_target/gen_link.ld at generation time; the MMIO page and its
# registers are defined here. Every address renders as a 32'h parameter in gen_tb_pkg.sv, as
# MEMORY_MAP in gen_knobs.py and as GEN_MM_* in gen_isa_shim_map.h; each register also renders its size.
memory_map:
  boot_addr_default: 0x80000000
  boot_page_mask: 0xFFFFFF00     # the first fetch is {boot_addr[31:8], 8'h80} (rtl/ibex_if_stage.sv)
  boot_reset_offset: 0x80   # first fetch is {boot[31:8], 8'h80} (rtl/ibex_if_stage.sv:243): the shim's reset pc, the PROG origin check and the export test read it here
  mmio_base: 0x8FFFF000
  mmio_size: 0x1000
  registers:            # offset and size inside the MMIO page
    sig_addr: {offset: 0x000, size: 0x100}   # riscv-dv signature_addr window (TEST_RESULT and signature writes)
    irq_ack_addr: {offset: 0x100, size: 0x4} # handler store releases the pending line (UNTIL_ACK policy)
    eot_addr: {offset: 0x104, size: 0x4}     # end-of-test register (in addition to the tohost symbol)
    phase_mark_addr: {offset: 0x108, size: 0x4}  # program-side region marker store (DV Lead REG phase log)

# Record and event export (architecture Section 9): the R-line field order (every gen_rvfi_txn field; the CHERIoT
# capability fields and mem_is_cap are excluded as the carve-out, rs3 is exported because the draft-B ternary ops use
# it), the counter words appended under +gen_export_counters, and the event table (one
# writer function per row rendered into dv/auto_dv/env/gen_export_event_lines.svh; every row names one exact
# event, no wildcard rows: the plan's sunset matches marked items on rendered rows). Rendered as GEN_EXPORT_* in gen_tb_pkg.sv and EXPORT_* in gen_knobs.py.
export_record_fields: [order, pc_rdata, pc_wdata, insn, trap, halt, intr, mode, ixl, rs1_addr, rs1_rdata, rs2_addr, rs2_rdata, rs3_addr, rs3_rdata,
                       rd_addr, rd_wdata, mem_addr, mem_rmask, mem_wmask, mem_rdata, mem_wdata, ext_pre_mip, ext_post_mip,
                       ext_nmi, ext_nmi_int, ext_debug_req, ext_debug_mode, ext_rf_wr_suppress, ext_ic_scr_key_valid,
                       ext_irq_valid, ext_exp_valid, ext_exp_insn, ext_exp_last, ext_mcycle, cycle]
export_counter_fields: [mhpmcounter3, mhpmcounter4, mhpmcounter5, mhpmcounter6, mhpmcounter7, mhpmcounter8, mhpmcounter9,
                        mhpmcounter10, mhpmcounter11, mhpmcounter12, mhpmcounter3h, mhpmcounter4h, mhpmcounter5h,
                        mhpmcounter6h, mhpmcounter7h, mhpmcounter8h, mhpmcounter9h, mhpmcounter10h, mhpmcounter11h,
                        mhpmcounter12h]
export_events:
  - {source: ibus, event: req, fields: [addr, we, be]}
  - {source: ibus, event: gnt, fields: [addr, we, be, req_cycle, outstanding_after]}
  - {source: ibus, event: rvalid, fields: [addr, we, err, intg_injected, outstanding_after]}
  - {source: dbus, event: req, fields: [addr, we, be]}
  - {source: dbus, event: gnt, fields: [addr, we, be, req_cycle, outstanding_after]}
  - {source: dbus, event: rvalid, fields: [addr, we, err, intg_injected, outstanding_after]}
  - {source: pin, event: irq_software, fields: [value]}
  - {source: pin, event: irq_timer, fields: [value]}
  - {source: pin, event: irq_external, fields: [value]}
  - {source: pin, event: irq_fast, fields: [idx, value]}
  - {source: pin, event: irq_nm, fields: [value]}
  - {source: pin, event: debug_req, fields: [value]}
  - {source: pin, event: fetch_enable, fields: [value]}
  - {source: pin, event: mcounteren_writable, fields: [value]}
  - {source: alert, event: alert_minor, fields: [value]}
  - {source: alert, event: alert_major_bus, fields: [value]}
  - {source: alert, event: alert_major_internal, fields: [value]}
  - {source: alert, event: double_fault_seen, fields: [value]}
  - {source: misc, event: irq_pending, fields: [value]}
  - {source: misc, event: core_busy, fields: [value]}
  - {source: misc, event: crash_dump_current_pc, fields: [value]}
  - {source: misc, event: crash_dump_next_pc, fields: [value]}
  - {source: misc, event: crash_dump_last_data_addr, fields: [value]}
  - {source: misc, event: crash_dump_exception_pc, fields: [value]}
  - {source: misc, event: crash_dump_exception_addr, fields: [value]}
  - {source: icram, event: inject, fields: [way, index]}
  - {source: icram, event: lookup, fields: [index]}
  - {source: icram, event: tag_write, fields: [way, index, valid]}
  - {source: icram, event: fill_write, fields: [way, index]}
  - {source: scrkey, event: req, fields: [value]}
  - {source: scrkey, event: valid, fields: [value]}
  - {source: regime, event: phase, fields: [knob_id, value_idx, phase_idx]}

# Sources whose writers are instanced in this build (the plan's sunset input; Runtime copies the rendered
# EXPORT_ACTIVE_SOURCES into build_manifest.yaml export_sources_emitted and the sink derives the header's sources= from it).
# icram waits for the RAM model's announcement port.
export_active_sources: [ibus, dbus, pin, alert, misc, scrkey, regime]
