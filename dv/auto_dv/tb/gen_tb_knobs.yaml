# gen_tb_knobs.yaml: the ONE source of plusarg names, regime-knob value sets and their numeric windows,
# TB constants and the TB memory map (architecture C11). dv/auto_dv/tb/gen_knobs_codegen.py renders it
# into the marked region of gen_tb_pkg.sv, dv/auto_dv/tb/gen_env_cfg_knobs.svh, dv/auto_dv/gen_tb/gen_knobs.py
# and dv/auto_dv/isa/gen_isa_shim_map.h; `--check` fails when any rendered file is stale; load() refuses
# any key outside the schema. Plusarg `name` renders as `+gen_<name>=...` and `PLUSARG_<NAME>`; enum
# values are the DV Lead's regime knobs (docs/gen_fcov_plan.md Section REG). Every desc is quoted.
schema_version: 1
# smepmp: Ibex implements mseccfg (MML/MMWP/RLB); without it the model traps on csr 0x747 (lock-step run out_2a)
isa_string: rv32imc_zicsr_zifencei_zba_zbb_zbc_zbs_zca_zcb_zcmp_zicntr_zihpm_zicclsm_smepmp

plusargs:
  # ---- environment ----
  - {name: build_config, kind: string, default: opentitan, desc: "build configuration name echoed in the banner (must match the compile)"}
  - {name: smoke_cycles, kind: int, default: 3000, desc: "bounded run length of gen_smoke_tb_top"}
  - {name: smoke_intg_flip, kind: int, default: null, desc: "smoke red-run knob, bit of the SECDED-encoded NOP word to flip (absent = no corruption)"}
  - {name: dbg_csr_probe, kind: bool, default: 0, debug_only: true, desc: "probe P6 (docs/gen_probe_register.md), debug only, never in a measured run"}
  - {name: mem_image, kind: string, default: null, desc: "program image (.vmem) loaded once at time 0"}
  - {name: mem_image_crc32, kind: hex, default: null, desc: "CRC-32 over (index, word) pairs from the .sym.json sidecar, recomputed after load"}
  - {name: mem_image_words, kind: int, default: null, desc: "word count from the sidecar"}
  - {name: mem_readback_words, kind: int, default_from: GEN_MEM_READBACK_WORDS_DEFAULT, desc: "words Python reads back through MEM_PEEK and compares with the .vmem"}
  - {name: tohost_addr, kind: hex, default: null, desc: "address of the program tohost word (sidecar symbol); a store there ends the test with the stored code"}
  - {name: mem_unmapped_ok, kind: bool, default: 0, desc: "unmapped bus access returns an error response instead of a TB error"}
  - {name: boot_addr, kind: hex, default_from: memory_map.boot_addr_default, desc: "boot_addr_i (must match the image entry page)"}
  - {name: hart_id, kind: hex, default: 0, desc: "hart_id_i (architecture C1)"}
  - {name: alive_timeout, kind: int, default_from: GEN_ALIVE_TIMEOUT_CYCLES_DEFAULT, desc: "cycles before the SV alive watchdog fatals (TB_CONTRACT Section 2)"}
  - {name: finish_timeout, kind: int, default_from: GEN_FINISH_TIMEOUT_CYCLES_DEFAULT, desc: "finish-handshake budget in cycles used by GenBridge.finish() when the test passes none"}
  - {name: regime_sched, kind: string, default: null, desc: "layer-3 schedule knob:value@r<N>|c<N>,... (consumed when supplied, else derived from RANDOM_SEED and echoed)"}
  - {name: rvfi_trace, kind: bool, default: 0, debug_only: true, desc: "print every RVFI record (debug only)"}
  - {name: fcov_en, kind: bool, default: 1, desc: "instantiate covergroups"}
  - {name: icram_init, kind: enum, values: [zero, random], default: random, desc: "initial contents of the icache tag/data RAM models"}
  - {name: fetch_en_at_reset, kind: bool, default: 1, desc: "fetch_enable_i On out of reset; 0 holds the core until a bridge FETCH_EN command (image read-back happens first)"}
  - {name: key_reset_valid, kind: bool, default: 1, desc: "ic_scr_key_valid_i high out of reset (ibex_top behaviour)"}
  - {name: sb_trace, kind: bool, default: 0, debug_only: true, desc: "scoreboard per-record trace (debug only)"}
  - {name: isa_pc_next_mask_b13, kind: bool, default: 1, desc: "isa_pc_next masks bit 0 of rvfi_pc_wdata on jalr records (bug candidate B13, rtl-arch R11); 0 = the raw rule, for the expected-fail test of the odd-target report"}
  - {name: isa_string, kind: string, default: null, debug_only: true, desc: "model ISA string override (debug only; the default is GEN_ISA_STRING)"}
  - {name: isa_log, kind: string, default: null, debug_only: true, desc: "model commit log path (debug only)"}
  # ---- record and event export (architecture Section 9, T-080) ----
  - {name: export_file, kind: string, default: null, desc: "record/event export file (relative to the run directory); absent = no export"}
  - {name: export_counters, kind: bool, default: 0, desc: "append the hpm counter words to every R line of the export"}
  - {name: export_sources, kind: string, default: all, desc: "comma-separated event sources written to the export (all = every source with a registered writer)"}
  - {name: export_flush_every, kind: int, default: 0, debug_only: true, desc: "flush the export file every n records for triage of abnormal ends (0 = only on EXPORT_FLUSH)"}
  # ---- TB unit-test knobs (gen_tests/*) ----
  - {name: ut_boot_retire, kind: int, default: 200, desc: "retirements the boots-and-retires test waits for"}
  - {name: ut_rows_set, kind: enum, values: [regime_nmi, regime_dbg], default: regime_nmi, desc: "gen_ut_export_rows: the pin row exercised beside regime phase (irq_nm through NMI_PULSE, or debug_req through DBG_REQ)"}
  # ---- numeric agent overrides (layer 1 windows; an enum knob below sets them unless overridden) ----
  - {name: ibus_gnt_min, kind: int, default: null, desc: "instruction bus grant latency low bound (cycles)"}
  - {name: ibus_gnt_max, kind: int, default: null, desc: "instruction bus grant latency high bound"}
  - {name: ibus_rvalid_min, kind: int, default: null, desc: "instruction bus response latency low bound (hard floor 1)"}
  - {name: ibus_rvalid_max, kind: int, default: null, desc: "instruction bus response latency high bound"}
  - {name: ibus_max_outstanding, kind: int, default: null, desc: "grants in flight before gnt is withheld (cap GEN_IBUS_MAX_OUTSTANDING)"}
  - {name: ibus_err_rate, kind: int, default: null, desc: "per-mille probability of instr_err_i per response"}
  - {name: ibus_intg_err_rate, kind: int, default: null, desc: "per-mille probability of corrupting instr_rdata_i integrity"}
  - {name: ibus_intg_bits, kind: int, default: 1, desc: "bits flipped per corrupted instruction response (1 or 2)"}
  - {name: ibus_err_window, kind: string, default: null, desc: "lo:hi address window where injected instruction errors apply"}
  - {name: dbus_gnt_min, kind: int, default: null, desc: "data bus grant latency low bound"}
  - {name: dbus_gnt_max, kind: int, default: null, desc: "data bus grant latency high bound"}
  - {name: dbus_rvalid_min, kind: int, default: null, desc: "data bus response latency low bound (hard floor 1)"}
  - {name: dbus_rvalid_max, kind: int, default: null, desc: "data bus response latency high bound"}
  - {name: dbus_max_outstanding, kind: int, default: null, desc: "data grants in flight (cap GEN_DBUS_MAX_OUTSTANDING)"}
  - {name: dbus_err_rate, kind: int, default: null, desc: "per-mille probability of data_err_i per response"}
  - {name: dbus_intg_err_rate, kind: int, default: null, desc: "per-mille probability of corrupting data_rdata_i integrity"}
  - {name: dbus_intg_bits, kind: int, default: 1, desc: "bits flipped per corrupted data response"}
  - {name: dbus_err_window, kind: string, default: null, desc: "lo:hi address window where injected data errors apply"}
  - {name: dbus_err_half, kind: enum, values: [first, second, both, any], default: any, desc: "which half of a split access an injected error hits"}
  - {name: dbus_err_store_perform, kind: bool, default: 1, desc: "an errored store still updates the memory model"}
  - {name: key_delay_min, kind: int, default: 1, desc: "scramble-key response delay low bound"}
  - {name: key_delay_max, kind: int, default: 20, desc: "scramble-key response delay high bound"}
  - {name: key_never_cycles, kind: int, default: 0, desc: "cycles the key stays withheld in the withheld_then_valid regime"}
  - {name: irq_min_gap, kind: int, default: 0, desc: "minimum cycles between interrupt events"}
  - {name: irq_hold_min, kind: int, default: 1, desc: "interrupt line hold low bound (CYCLES policy)"}
  - {name: irq_hold_max, kind: int, default: 50, desc: "interrupt line hold high bound"}
  - {name: dbg_hold_min, kind: int, default: 1, desc: "debug_req_i hold low bound"}
  - {name: dbg_hold_max, kind: int, default: 50, desc: "debug_req_i hold high bound"}
  # ---- layer-2 regime knobs (DV Lead, gen_fcov_plan.md Section REG; +gen_knob_<name>=<value>). regime_set_consumer names the
  # run-time consumer of REGIME_SET for the knob (bus, irq, dbg, scrkey), none (no run-time consumer yet: the dispatcher
  # refuses it) or program (a program-side region marker); rendered as REGIME_SET_CONSUMED and gen_knob_regime_set_consumed() ----
  - {name: knob_imem_gnt_delay, kind: enum, values: [same_cycle, short, long, random], default: short, regime_set_consumer: bus, desc: "instruction grant latency regime (windows: regime_windows.gnt_delay)"}
  - {name: knob_imem_rvalid_delay, kind: enum, values: [min1, short, long, random], default: short, regime_set_consumer: bus, desc: "instruction response latency regime (windows: regime_windows.rvalid_delay)"}
  - {name: knob_imem_err_rate, kind: enum, values: [none, rare, frequent], default: none, regime_set_consumer: bus, desc: "instr_err_i injection regime (rates: regime_windows.rate_per_mille)"}
  - {name: knob_imem_intg_err_rate, kind: enum, values: [none, rare, frequent], default: none, regime_set_consumer: bus, desc: "instruction integrity corruption regime (rates: regime_windows.rate_per_mille)"}
  - {name: knob_imem_outstanding_cap, kind: enum, values: [cap1, cap2, cap4, cap8], default: cap8, regime_set_consumer: bus, desc: "instruction grants in flight cap (regime_windows.outstanding_cap)"}
  - {name: knob_dmem_gnt_delay, kind: enum, values: [same_cycle, short, long, random], default: short, regime_set_consumer: bus, desc: "data grant latency regime (windows: regime_windows.gnt_delay)"}
  - {name: knob_dmem_rvalid_delay, kind: enum, values: [min1, short, long, random], default: short, regime_set_consumer: bus, desc: "data response latency regime (windows: regime_windows.rvalid_delay)"}
  - {name: knob_dmem_err_rate, kind: enum, values: [none, rare, frequent], default: none, regime_set_consumer: bus, desc: "data_err_i injection regime (rates: regime_windows.rate_per_mille)"}
  - {name: knob_dmem_intg_err_rate, kind: enum, values: [none, rare, frequent], default: none, regime_set_consumer: bus, desc: "data integrity corruption regime (rates: regime_windows.rate_per_mille)"}
  - {name: knob_irq_regime, kind: enum, values: [quiet, sparse, storm], default: quiet, regime_set_consumer: irq, desc: "interrupt event rate"}
  - {name: knob_irq_line_mix, kind: enum, values: [single, multi, fast_only, with_nmi], default: single, regime_set_consumer: irq, desc: "lines per interrupt event"}
  - {name: knob_irq_hold, kind: enum, values: [until_taken, through_handler, pulse], default: until_taken, regime_set_consumer: irq, desc: "interrupt line release policy"}
  - {name: knob_debug_req_regime, kind: enum, values: [none, sparse, storm], default: none, regime_set_consumer: dbg, desc: "debug_req_i event rate"}
  - {name: knob_scr_key_delay, kind: enum, values: [immediate, delayed, withheld_then_valid], default: immediate, regime_set_consumer: scrkey, desc: "scramble-key response regime"}
  - {name: knob_icache_ecc_err_rate, kind: enum, values: [none, rare, frequent], default: none, regime_set_consumer: none, desc: "icache RAM ECC injection regime"}
  - {name: knob_fetch_enable_regime, kind: enum, values: [always_on, toggling], default: always_on, regime_set_consumer: none, desc: "fetch_enable_i regime"}
  - {name: knob_mcounteren_writable, kind: enum, values: ["on", "off", invalid], default: "on", regime_set_consumer: none, desc: "mcounteren_writable_i encoding"}
  - {name: knob_instr_mix, kind: enum, values: [isa_only, m_heavy, compressed_heavy, bitmanip_heavy, csr_heavy, ls_heavy, branch_heavy, mixed], default: mixed, regime_set_consumer: program, desc: "program-side instruction mix (region marker)"}
  - {name: knob_priv_regime, kind: enum, values: [m_only, u_heavy, alternating], default: m_only, regime_set_consumer: program, desc: "program-side privilege regime (region marker)"}
  - {name: knob_pmp_regime, kind: enum, values: ["off", sparse, dense, mml_on], default: "off", regime_set_consumer: program, desc: "program-side PMP regime (region marker)"}
  # ---- checker enables (+gen_chk_<id>=0|1, default 1; +gen_chk_all=0 disables all unless re-enabled) ----
  - {name: chk_all, kind: bool, default: 1, desc: "master checker enable (isolation mode +gen_chk_all=0 +gen_chk_<id>=1)"}
  - {name: chk_ibus_proto, kind: bool, default: 1, desc: "checker enable"}
  - {name: chk_ibus_outstanding, kind: bool, default: 1, desc: "checker enable"}
  - {name: chk_sva_st, kind: bool, default: 1, desc: "protocol SVA group enable, gen_binds.sv (gen_protocol_props ids sva_st_*)"}
  - {name: chk_sva_ibus, kind: bool, default: 1, desc: "protocol SVA group enable, gen_binds.sv (gen_protocol_props ids sva_ibus_*)"}
  - {name: chk_sva_dbus, kind: bool, default: 1, desc: "protocol SVA group enable, gen_binds.sv (gen_protocol_props ids sva_dbus_*)"}
  - {name: chk_sva_icram, kind: bool, default: 1, desc: "protocol SVA group enable, gen_binds.sv (gen_protocol_props ids sva_icram_*)"}
  - {name: chk_sva_scrkey, kind: bool, default: 1, desc: "protocol SVA group enable, gen_binds.sv (gen_protocol_props ids sva_scrkey_*)"}
  - {name: chk_sva_irq, kind: bool, default: 1, desc: "protocol SVA group enable, gen_binds.sv (gen_protocol_props ids sva_irq_*)"}
  - {name: chk_sva_dbg, kind: bool, default: 1, desc: "protocol SVA group enable, gen_binds.sv (gen_protocol_props ids sva_dbg_*)"}
  - {name: chk_sva_alert, kind: bool, default: 1, desc: "protocol SVA group enable, gen_binds.sv (gen_protocol_props ids sva_alert_*)"}
  - {name: chk_sva_rvfi, kind: bool, default: 1, desc: "protocol SVA group enable, gen_binds.sv (gen_protocol_props ids sva_rvfi_*)"}
  - {name: chk_sva_rvalid_legal, kind: bool, default: 1, desc: "TB self-check enable (stimulus legality)"}
  - {name: chk_dbus_proto, kind: bool, default: 1, desc: "checker enable"}
  - {name: chk_dbus_outstanding, kind: bool, default: 1, desc: "checker enable"}
  - {name: chk_dbus_split, kind: bool, default: 1, desc: "checker enable"}
  - {name: chk_dbus_store_intg, kind: bool, default: 1, desc: "checker enable"}
  - {name: chk_icram_write_ecc, kind: bool, default: 1, desc: "checker enable"}
  - {name: chk_icram_inval_sweep, kind: bool, default: 1, desc: "checker enable"}
  - {name: chk_icram_ecc_response, kind: bool, default: 1, desc: "checker enable"}
