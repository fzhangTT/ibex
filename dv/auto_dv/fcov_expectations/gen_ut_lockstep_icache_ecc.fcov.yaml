# CG-IC-006 part 1, the bins THIS entry can hit: tag-RAM injection at the frequent rate, probe on.
# Derived from the entry's own plusargs and confirmed by a run of the entry ALONE in its own output directory, so
# no other run's coverage contributed. Robust means a structural bound or a measured count of at least 30 in that
# run; the count is in each note. Nine such manifests, one per WP-8 icache ECC entry, and their union is the
# part-1 reachable set of 15 minus the two bins no entry hits robustly.
#
# EXCLUDED FROM THIS ENTRY, thin here and not declared so a single seed cannot fail the run falsely:
#   gen_ic_ecc_cg.cp_no_alert_case.during_invalidation  measured 10 in this entry's run
# Two of those are OWED group-wide and close on a seed sweep at coverage closure: during_invalidation and
# masked_duplicate_copy. The others are per-entry exclusions only, since the bin is robust on other entries.
test: gen_ut_lockstep_icache_ecc
owner: tb-infra
bins:
  - gen_ic_ecc_cg.cp_ram.tag
  - gen_ic_ecc_cg.cp_bits.single
  - gen_ic_ecc_cg.cp_way.way0
  - gen_ic_ecc_cg.cp_way.way1
  - gen_ic_ecc_cg.cp_alert_pulses.one
  - gen_ic_ecc_cg.cp_major_nmi_quiet.yes
  - gen_ic_ecc_cg.cp_no_alert_case.uninitialised_data_ram
anti_vacuity:
  gen_ic_ecc_cg.cp_ram.tag: "a tag-RAM injection the monitor closed; the kind is the announcing instance's own, so a hit proves the tag hook fired and its announcement was judged; measured 925 in this entry's own run, so declaring it cannot fail on a single seed"
  gen_ic_ecc_cg.cp_bits.single: "the flipped-bit count is the announcement's own field, so a hit proves an injection ran with the one-bit knob in force; measured 925 in this entry's own run, so declaring it cannot fail on a single seed"
  gen_ic_ecc_cg.cp_way.way0: "the way is the injecting instance's own parameter, so a hit proves way 0's model injected and was judged; measured 464 in this entry's own run, so declaring it cannot fail on a single seed"
  gen_ic_ecc_cg.cp_way.way1: "as way0 for way 1; the pair proves both way instances inject, which a single-way build could not produce; measured 461 in this entry's own run, so declaring it cannot fail on a single seed"
  gen_ic_ecc_cg.cp_alert_pulses.one: "sampled only when the injection OWED a pulse and exactly one was credited, so a hit proves the judge decided the injected way was the hit way and the monitor credited one pulse in the window; an unjudged injection passes not-applicable; measured 915 in this entry's own run, so declaring it cannot fail on a single seed"
  gen_ic_ecc_cg.cp_major_nmi_quiet.yes: "both major alert outputs low in every cycle of the injection window AND at least one retirement inside the retirement window carrying no internal-NMI flag; a window with no retirement passes not-applicable, so a hit cannot come from an absence of retirements; measured 781 in this entry's own run, so declaring it cannot fail on a single seed"
  gen_ic_ecc_cg.cp_no_alert_case.uninitialised_data_ram: "a never-written data line read on a qualified lookup with no injection in that cycle and alert_minor_o low across the window; the read is quiet WITHOUT BEING CHECKED, by two exhaustive cases since tag_hit_ic1 is the OR of the mux's own per-way predicate (rtl/ibex_icache.sv:504) -- a matching way excludes this one from the mux and so from the decoder (:499-500, :507-514, :568-573), and no matching way masks the data-ECC term itself (:585). First read per line per way, which bounds a run to at most 512 samples; measured 35 in this entry's own run, so declaring it cannot fail on a single seed"
