# CG-IC-006 part 1. Derived from gen_trace_tp_bin.csv, not typed: every distinct coverpoint-and-bin pair of the group
# except the four part-2 coverpoints and cr_ram_x_inval. cp_knob's three rendered bins are namable in no manifest,
# since they have no rows in the traceability CSV. The four part-2 coverpoints are owned by the plan and the render,
# declared here by nothing, hidden by no ignore_bins.
#
# FOURTEEN CROSS BINS ARE OWED, NOT ABSENT, and the reason is a defect in the shared expectation checker, not in this
# group. ci/check_fcov_expectations.py's report parser recognises only urg's per-coverpoint heading and never the
# per-cross one, so no cg.cross.bin key is ever produced and a manifest declaring a cross bin can never pass: measured
# on this group, all 14 read as MISSING-FROM-REPORT while four of them carry counts of 483, 459, 445 and 904 in that
# same report. Worse, the cross heading only clears the parser's in-bins flag and leaves the coverpoint name set, so a
# cross bin's count is attributed to the group's LAST coverpoint: the parser emits gen_ic_ecc_cg.cp_knob.data_single_way0
# = 483 and cp_knob.single_frequent = 904, both cross bins. A declared coverpoint bin therefore reads as HIT whenever a
# cross bin of the same name is hit in that group. Owner item LOG-084; the interim ruling declares the 15 coverpoint
# bins and records these 14 as owed until the owner rules.
#
# THAT HAZARD CANNOT MASK ANY BIN DECLARED BELOW, for two independent reasons, both measured: no coverpoint bin name in
# this group equals any cross bin name (22 coverpoint names against 16 cross names, intersection empty), and the
# coverpoint the mis-attribution lands on is cp_knob, the last one, which declares no bin here at all. The bin name
# `yes` is shared by cp_lookups_blocked_next, cp_major_nmi_quiet and cp_refetch, but coverpoint-to-coverpoint sharing
# is not the hazard: the parser keys by coverpoint, so only a CROSS bin sharing a coverpoint bin's name can mask one.
group: CG-IC-006
owner: tb-infra
bins:
  - gen_ic_ecc_cg.cp_ram.tag
  - gen_ic_ecc_cg.cp_ram.data
  - gen_ic_ecc_cg.cp_bits.double
  - gen_ic_ecc_cg.cp_bits.single
  - gen_ic_ecc_cg.cp_way.way0
  - gen_ic_ecc_cg.cp_way.way1
  - gen_ic_ecc_cg.cp_beat.beat0
  - gen_ic_ecc_cg.cp_beat.beat1
  - gen_ic_ecc_cg.cp_alert_pulses.one
  - gen_ic_ecc_cg.cp_major_nmi_quiet.yes
  - gen_ic_ecc_cg.cp_no_alert_case.disabled_cache
  - gen_ic_ecc_cg.cp_no_alert_case.during_invalidation
  - gen_ic_ecc_cg.cp_no_alert_case.uninitialised_data_ram
  - gen_ic_ecc_cg.cp_no_alert_case.unused_way_data
  - gen_ic_ecc_cg.cp_no_alert_case.masked_duplicate_copy
bins_owed_checker_defect:   # LOG-084: declare these once the checker parses cross bins
  - gen_ic_ecc_cg.cr_ram_x_bits_x_way.tag_double_way0
  - gen_ic_ecc_cg.cr_ram_x_bits_x_way.tag_double_way1
  - gen_ic_ecc_cg.cr_ram_x_bits_x_way.tag_single_way0
  - gen_ic_ecc_cg.cr_ram_x_bits_x_way.tag_single_way1
  - gen_ic_ecc_cg.cr_ram_x_bits_x_way.data_double_way0
  - gen_ic_ecc_cg.cr_ram_x_bits_x_way.data_double_way1
  - gen_ic_ecc_cg.cr_ram_x_bits_x_way.data_single_way0
  - gen_ic_ecc_cg.cr_ram_x_bits_x_way.data_single_way1
  - gen_ic_ecc_cg.cr_data_x_beat.data_beat0
  - gen_ic_ecc_cg.cr_data_x_beat.data_beat1
  - gen_ic_ecc_cg.cr_bits_x_rate.double_frequent
  - gen_ic_ecc_cg.cr_bits_x_rate.single_frequent
  - gen_ic_ecc_cg.cr_bits_x_rate.double_rare
  - gen_ic_ecc_cg.cr_bits_x_rate.single_rare
