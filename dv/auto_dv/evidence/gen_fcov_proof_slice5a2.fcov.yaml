anti_vacuity:
  gen_rvfi_record_cg.cp_trap.no: "plan CG-RVFI-001 anti-vacuity: rvfi_valid is a pulse (one cycle per retired instruction, never continuous), and every coverpoint is a property of the record relative to the previous one (continuity, order, gap) or a discriminating record class, so the bins prove inter-record relations and record classes, not the mere existence of a record. Constant fields (rvfi_ixl == 1, rvfi_halt == 0) and 'order advanced by one' are gen_chk_rvfi_proto rules, not bins (retired: cp_ixl, cp_halt, cp_order_step.one). This group OWNS cp_trap; the cp_trap copies in CG-RVFI-002/003 and CG-CHERI-001 are cross operands only; the hit is a retired instruction the lock-step compare judged against the ISA model"
