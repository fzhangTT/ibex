corrigendum_2026_09_05T11_47Z:
  export_run_not_spent: 'The export run on this seed is no longer needed for the diagnosis and tb-infra-2 has released
    it. No slot was spent on it.

    '
  fire_count: 'The record first said the deciding property fires 6 TIMES. IT FIRES 3. Six lines in that run''s sim.log
    mention the identifier and they PAIR UP: each firing emits a VCS assertion-source line naming gen_protocol_props.sv:299
    and then a UVM_ERROR line. Counting only the UVM_ERROR lines gives 3, which is also what rtl-arch''s ibus-signature
    table records for this seed. Found by tb-infra-2. THIS IS A REPEAT OF AN ERROR THE RUNTIME MANAGER HAD ALREADY
    CLOSED THE SAME HOUR: the 343-against-334 count on the irq_entry fires, where nine of 343 were UVM end-of-simulation
    tally lines rather than fires. The rule was written down and then broken again in a different disguise. A line
    mentioning an identifier is not a firing; count the lines that ARE the event.

    '
  the_seed_is_diagnosed_and_it_is_not_a_checker_defect: 'This record framed the 258 fires as a second mechanism
    for tb-infra-2''s checker. That framing is SUPERSEDED. tb-infra-2 read the run in one pass and every figure
    in this block reproduces exactly (258 fires, 18 distinct raised bitmaps, mstatus 00000088 and mie 7fff0888 at
    every fire, deltas 18 to 23 distributed 153/67/23/7/3/5). The answer is ORDERING: the first model-versus-DUT
    instruction divergence is at 9290500, about 6443 cycles BEFORE the first irq_entry fire at 15737500, with 23387
    isa_insn mismatches already reported by then; the core is executing 0x00000000 at pc 0x80000022 while the model
    is at 0x80000154, and a bus anomaly precedes even that. So the fires are DOWNSTREAM of a fetch and execution
    breakdown, and at every one of them the interrupt was takeable and a running core would have taken it. The checker
    is telling the truth. tb-infra-2''s landing neither fixes nor claims this seed, and this record should not have
    implied that it was its to fix. The Runtime Manager re-derived the three timing figures rather than adopt them,
    and records a near-miss while doing so: the gap was first computed as 64470 cycles by dividing the tick difference
    by 100, where the tick is 10 ps against a 10 ns clock so the divisor is 1000. Caught before it was written down.

    '
corrigendum_2026_09_05T12_46Z:
  conclusion_unaffected: the fires are downstream of a fetch and execution breakdown; the checker is telling the
    truth
  earliest_mechanism: 'the bus anomaly is not the earliest. By first firing, counting UVM_ERROR lines only: sva_rvfi_irq_valid_exclusive
    cycle 6591.5 (3), sva_ibus_gnt_only_with_req 9250.5 (1), the divergent store''s LSU-stage unmapped write 9284.5,
    isa_insn 9290.5 (23387), irq_entry 15737.5 (258), sva_ibus_outstanding_max 26503.5 (450021).'
  gap_cycles: '6447, not the ''about 6443'' written above: (15737500 - 9290500) / 1000 = 6447. The near-miss recorded
    in this block, 64470 from dividing by 100, is the same figure with the wrong divisor.'
  withdrawn_reading: 'the unmapped write to 0x40000000 is NOT a separate event: order 462 at 9290500 is pc=80000154
    insn=0062a023, a full-word store, whose line carries mem=40000000 with a 1111 mask, so the 9284500 write is
    that instruction six cycles earlier at the LSU stage. Established by rtl-arch; a consequence of the wrong word,
    not a route to it.'
