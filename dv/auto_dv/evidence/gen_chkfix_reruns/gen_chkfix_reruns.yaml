the_reds_are_closed: >
  3 of 3. The masking is gone: both seeds that previously failed for an undeclared reason now read RED-OK on
  the declared reason with ZERO checker fires.
the_finding: >
  The 258-fire seed is UNCHANGED. 258 fires in the wave run at 4017573 and 258 here at 9c7f8f6, counted both
  times with the not-taken pattern rather than by lines mentioning the id. Not reduced, not reshaped.
  THE FIX IS DEMONSTRABLY IN THE BUILD and this is not a stale binary: the message now carries the enable
  mapping ("lines 00020 (enable bits 00040000)"), which the pre-fix message did not print.
  What the new field shows, all of it re-derived here rather than taken from the message text:
  every one of the 18 distinct raised-line bitmaps has its enable bit SET in mie 7fff0888 (all eighteen
  enable words checked against the mask, none unset); mstatus is 00000088 throughout so the global enable is
  set at the sample; the raise-to-fire order deltas are 18 to 23, with 18 dominating at 153 of 258, then 19
  at 67, 20 at 23, 21 at 7, 22 at 3, 23 at 5; the raised lines are FAST lines, bits 16 upward, over eighteen
  distinct bitmaps, where the analysis that produced the masked-handler arithmetic was on line 0, the
  software line at bit 3.
  The delta range is the same family as the window the fix addresses, yet the accrual still happens here,
  while the two red seeds went to zero on the same build. So whatever withholds these interrupts is not what
  the reds were hitting. The diagnosis is tb-infra-2's; this record states the measurement only.
method_note: >
  Fires counted with the not-taken pattern, not by lines mentioning the id, because the id also appears on
  UVM end-of-simulation per-id tally lines. This run carries zero tally lines and both counts agree at 258,
  but it was checked rather than assumed.

corrigendum_2026_09_05T11_47Z:
  fire_count: >
    The record first said the deciding property fires 6 TIMES. IT FIRES 3. Six lines in that run's sim.log
    mention the identifier and they PAIR UP: each firing emits a VCS assertion-source line naming
    gen_protocol_props.sv:299 and then a UVM_ERROR line. Counting only the UVM_ERROR lines gives 3, which is
    also what rtl-arch's ibus-signature table records for this seed. Found by tb-infra-2.
    THIS IS A REPEAT OF AN ERROR THE RUNTIME MANAGER HAD ALREADY CLOSED THE SAME HOUR: the 343-against-334
    count on the irq_entry fires, where nine of 343 were UVM end-of-simulation tally lines rather than fires.
    The rule was written down and then broken again in a different disguise. A line mentioning an identifier
    is not a firing; count the lines that ARE the event.
  the_seed_is_diagnosed_and_it_is_not_a_checker_defect: >
    This record framed the 258 fires as a second mechanism for tb-infra-2's checker. That framing is
    SUPERSEDED. tb-infra-2 read the run in one pass and every figure in this block reproduces exactly (258
    fires, 18 distinct raised bitmaps, mstatus 00000088 and mie 7fff0888 at every fire, deltas 18 to 23
    distributed 153/67/23/7/3/5). The answer is ORDERING: the first model-versus-DUT instruction divergence is
    at 9290500, about 6443 cycles BEFORE the first irq_entry fire at 15737500, with 23387 isa_insn mismatches
    already reported by then; the core is executing 0x00000000 at pc 0x80000022 while the model is at
    0x80000154, and a bus anomaly precedes even that. So the fires are DOWNSTREAM of a fetch and execution
    breakdown, and at every one of them the interrupt was takeable and a running core would have taken it.
    The checker is telling the truth. tb-infra-2's landing neither fixes nor claims this seed, and this record
    should not have implied that it was its to fix.
    The Runtime Manager re-derived the three timing figures rather than adopt them, and records a near-miss
    while doing so: the gap was first computed as 64470 cycles by dividing the tick difference by 100, where
    the tick is 10 ps against a 10 ns clock so the divisor is 1000. Caught before it was written down.
  export_run_not_spent: >
    The export run on this seed is no longer needed for the diagnosis and tb-infra-2 has released it. No slot
    was spent on it.
