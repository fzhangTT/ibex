the_finding: 'The 258-fire seed is UNCHANGED. 258 fires in the wave run at 4017573 and 258 here at 9c7f8f6, counted
  both times with the not-taken pattern rather than by lines mentioning the id. Not reduced, not reshaped. THE FIX
  IS DEMONSTRABLY IN THE BUILD and this is not a stale binary: the message now carries the enable mapping ("lines
  00020 (enable bits 00040000)"), which the pre-fix message did not print. What the new field shows, all of it re-derived
  here rather than taken from the message text: every one of the 18 distinct raised-line bitmaps has its enable
  bit SET in mie 7fff0888 (all eighteen enable words checked against the mask, none unset); mstatus is 00000088
  throughout so the global enable is set at the sample; the raise-to-fire order deltas are 18 to 23, with 18 dominating
  at 153 of 258, then 19 at 67, 20 at 23, 21 at 7, 22 at 3, 23 at 5; the raised lines are FAST lines, bits 16 upward,
  over eighteen distinct bitmaps, where the analysis that produced the masked-handler arithmetic was on line 0,
  the software line at bit 3. The delta range is the same family as the window the fix addresses, yet the accrual
  still happens here, while the two red seeds went to zero on the same build. So whatever withholds these interrupts
  is not what the reds were hitting. The diagnosis is tb-infra-2''s; this record states the measurement only.

  '
the_reds_are_closed: '3 of 3. The masking is gone: both seeds that previously failed for an undeclared reason now
  read RED-OK on the declared reason with ZERO checker fires.

  '
