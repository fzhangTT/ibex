fcov_check_provenance: >
  The runs were dispatched WITHOUT --fcov-check, so no run produced a checker log inline. The check was run
  POST-HOC through the flow's own gen_fcov.check_test, the exact function gen_run's --fcov-check path calls,
  against the coverage each run had already written. result.yaml is UNTOUCHED and still carries fcov_check
  null in all 119, so no record claims a check that happened during the run; each fcov_check.log's first
  line is the checker argv. check_test writes fcov_manifest_used.yaml, a RUN artifact name, so it is renamed
  to fcov_manifest_used.post.yaml in every run directory: nothing may claim a shape the run did not have.
caller_defect_found_and_corrected: >
  The first post-hoc pass called gen_fcov.run_checker directly. That takes the checker's --vdb/--cm-name
  branch, which builds a urg report with NO cross rewrite, so every cross bin read MISSING-FROM-REPORT: 91
  of csr_warl's 179, and by the same mechanism 20 of lock's 39 and 25 of mseccfg's 26. Read at face value
  that says all three MEASURED entries fail every seed of a measured round. It was caught before it was
  reported, by the shape of the number: 26 seeds each at exactly 88 hit and 91 unmet with ZERO variation is
  a structural absence, not stimulus, and 91 equals exactly the manifest's cross-bin count. gen_run's real
  path is check_test, which runs per_test_report and derived_report first to turn "Summary for Cross <cr>"
  into the variable form ci/check_fcov_expectations.py parses (LOG-054). NO defect exists in the flow, the
  manifests or the entries; the defect was in the caller and is corrected here.
two_independent_readers_agree: >
  Given that near-miss, the census and the checker were crossed before any claim was made. The per-test URG
  census (reviewed gen_read_keyed.parse_report, 119 reports read, 0 rejected, 407 bins in the family, the
  same population as the first block) and the post-hoc checker agree exactly: zero declared bins below the
  every-seed bar, zero declared bins absent from the census, zero unmet from the checker.
method: >
  Per-seed attribution from ONE urg report PER TEST selected by full path with -tests, because a merged
  report's per-bin TEST column caps at ten tests with no marker. Every per-test report's own covergroup
  totals are cross-checked against that report's groups.txt row before its bins are counted.
per_test_report_dir: scratchpad pertest_1b (one directory per test, named test_<entry>_<seed>)
metric_set_difference: >
  These runs omit CONDITION coverage from the metric set (the build did not pass --cond) where the first
