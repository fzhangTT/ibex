  THE FIRST THING TO LOOK AT, and it decides the question in one comparison: the ibus addr AT THE
  GRANT against the rdata at its matching rvalid. I verified the agent's contract rather than taking
  it: the pending entry latches the address and reads its word at grant time
  (`p.word = mem.read32(p.addr)`, dv/auto_dv/env/gen_agents_pkg.sv:321, with the entry pushed at :342
  and popped in order at :275), so the agent cannot reorder responses and cannot answer with a word
  for an address it never latched.

  I also checked the memory image itself, which removes one branch before the run: the run's own
  prog.vmem holds eb9ff06f at 0x80000340, ebdff06f at 0x80000344 and ec1ff06f at 0x80000348, i.e.
  exactly the disassembly. So the model's CONTENT is right, and the decision rule is:
    - if the grant whose response carried ec1ff06f had addr 0x80000348, the TB did exactly what it was
      asked and the fault is inside the core: the icache paired that word with output address
      0x80000340. Mechanism (1).
    - if that grant's addr was 0x80000340, the TB returned a word the image does not hold there, which
      given the read-at-grant contract means the latch or the model's indexing. Mechanism (3).
    - mechanism (2) is separately visible on exc_cause with csr_save_cause_o and on mcause_q.

