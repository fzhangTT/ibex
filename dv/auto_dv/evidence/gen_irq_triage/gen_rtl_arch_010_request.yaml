     H.{pc_id,instr_rdata_id,instr_valid_id}
     H.{rvfi_valid,rvfi_order,rvfi_pc_rdata,rvfi_pc_wdata,rvfi_insn,rvfi_intr,rvfi_mem_addr,rvfi_mem_rmask}
     insert_dummy_instr is included to keep the dummy-instruction path visible even though I have
