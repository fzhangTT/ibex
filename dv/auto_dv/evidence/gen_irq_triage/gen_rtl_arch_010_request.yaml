  THE INSTRUCTION BUS SHAPE AT THE FAILING FETCH, from those lines, re-derived by me:
  phase idx=0 at cycles 60-67 set imem_gnt_delay=short, imem_rvalid_delay=short,
  imem_outstanding_cap=cap8; phase idx=1 at cycles 77-82 then set imem_rvalid_delay=min1,
  imem_outstanding_cap=cap1 and imem_gnt_delay=same_cycle (alongside irq_regime=storm and
  irq_hold=through_handler). Nothing changes them afterwards, so at the failing fetch near cycle 1180
  the instruction bus was at CAP1, SAME-CYCLE GRANT, MIN1 RVALID. Read the wave with those, not with
  the defaults.

  WHAT THAT SHAPE DOES TO THE THREE MECHANISMS, and it helps:
  with an outstanding cap of one the agent grants only while its queue is empty
  (dv/auto_dv/env/gen_agents_pkg.sv:305), so at most one fetch is in flight at any moment. Every
  response therefore belongs to exactly one grant with no ambiguity, which makes the decision rule
  above airtight rather than a judgement call, and it removes the "answered the wrong outstanding
  request" half of mechanism (3) entirely: with a depth-one queue there is no other outstanding
  request to confuse. What survives of (3) is only a wrong latch or wrong indexing.
  It also makes the sequence around the redirect short and completely visible: each fetch is one
  req / gnt-same-cycle / rvalid triple, so the reading is to list those triples around cycle 1180 and
  find the one whose data is ec1ff06f.

