  WHY: the first interrupt record of that run carries pc 0x80000340 with instruction word ec1ff06f,
  and that word lives only at 0x80000348 in the image. I have traced the RTL and the pair cannot be
  produced by the RVFI stage, the IF/ID register or the re-vector recapture, so the wave has to show
  which side of the instruction-fetch handshake first carried 0x80000348's word against address
  0x80000340. My trace is dv/auto_dv/work/rtl-arch/gen_irq_vector_pc_insn_rtl_trace.md (scratch).

  THREE MECHANISMS THE SIGNAL LIST MUST SEPARATE, so the wave is not read twice:
  (1) the icache pairs its output address with the wrong data;
  (2) the cause or vector path picked a different slot than the fetch;
  (3) the TB instruction-memory model answered an outstanding request with the wrong word.

  SIGNALS. Hierarchy prefix H = gen_tb_top.u_dut.u_ibex_core, and C = H.if_stage_i.gen_icache.icache_i.

  A. Boundary handshake, which decides side (1)/(2) against (3):
     gen_tb_top.u_ibus_if.{req,gnt,rvalid,addr,rdata,err,outstanding,cycle}
     gen_tb_top.{instr_req,instr_addr,instr_gnt,instr_rvalid,instr_rdata}
     gen_tb_top.u_dut.{instr_req_o,instr_addr_o,instr_gnt_i,instr_rvalid_i,instr_rdata_i,instr_err_i}
     The interface's own `outstanding` counter is the field that shows a response matched to the
     wrong request, which is why it is named explicitly.

  B. The icache output pairing and its discard state, mechanism (1). This is the structural reason the
     mechanism is credible: in this cache the output ADDRESS and the output DATA are two paths kept in
     step by control, not one tagged pair. addr_o is {output_addr_q, 1'b0} (rtl/ibex_icache.sv:1193)
     while rdata_o comes from the fill-buffer arbiter and the skid register (:1192), and the half-word
     select inside the line is taken from output_addr_q (:1182). The register that is supposed to stop
     a redirected-away fill from driving the output is fill_stale_q, set by
     fill_stale_d[fb] = fill_busy_q[fb] & (branch_i | fill_stale_q[fb]) (:741) and consumed by
     fill_out_req[fb] (:796). So dump:
     C.{branch_i,addr_i,req_i,ready_i,valid_o,rdata_o,addr_o,err_o}
     C.{output_addr_q,output_addr_d,output_addr_en,output_addr_incr,output_valid,output_ready,data_valid}
     C.{output_data,output_data_lo,output_data_hi}
     C.{skid_valid_q,skid_data_q,skid_en,skid_complete_instr}
     C.{fill_busy_q,fill_stale_q,fill_stale_d,fill_out_req,fill_out_arb,fill_out_done,fill_data_sel}
     C.{prefetch_addr_q,prefetch_addr_en,lookup_addr_ic0,lookup_grant_ic0,lookup_req_ic0}
     If the cache is the culprit the wave shows addr_o stepping to 0x80000340 while the buffer driving
     output_data is one the branch should have marked stale.

  C. Fetch to ID to RVFI, which fixes the cycle the wrong word entered the pipeline:
