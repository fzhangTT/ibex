irq_entry_real_failures: >
  19 of 40, on mechanisms rather than coverage, kept separate because they have different owners.
  13 runs: the irq_entry CHECKER fires (gen_checkers_pkg.sv:133), "lines 00001 raised at cycle 44238 (order
  1381) not taken within 17 records (now order 1400, mie 7fff0888 mstatus 00000088)".
  CORRIGENDUM 2026-09-05T10:30Z, one row, superseding the reading first written here. THE FIRST READING WAS
  WRONG: it said mie bit 0 is clear while the raised line is bit 0, so the checker required a line the enable
  mask does not enable, and called it checker-versus-stimulus. The raised lines were ENABLED, and that holds
  across two different fires: the Test Writer read a run whose fires name fast lines 16 and 10 at mie bits 29
  and 23, and the Runtime Manager decoded a run whose fire names line 0 at bit 3, with identical mie
  0x7fff0888 and mstatus 0x88. THE CHECKER FIRES CORRECTLY. THE CAUSE IS A CHECKER DEFECT, tb-infra-2's, fix
  queued: the interrupt was legitimately masked for the whole of a previous handler, a 17-instruction handler
  from entry to return inclusive plus a two-instruction vector stub, so 19 masked records against a 17-record
  bound, and the measured raise-to-fire deltas are 18 to 23 with 19 dominating. The checker restarts its
  expectation's bound under the NMI and debug masks and does NOT restart it under the global enable, which
  appears only in the fire condition at expiry, so a line masked for an entire handler accrues bound and the
  fire then samples MIE after the mret has restored it. Both other candidate gates were measured ABSENT from
  the emitted program by the Test Writer: no compressed instructions, so no expansion commit phase, and no
  debug or step state. The original error was reading a line bitmap and a raw enable word in the same
  numbering without tracing the index-to-bit mapping. FIRE POPULATION, stated precisely because several counts
  here are close together. Of the 40 gen_test_irq_basic runs, 21 PASS, 13 fail with the checker as the
  verdict's reason, 5 fail on a protocol property and 1 on the harness timeout. FOURTEEN of the 40 CONTAIN at
  least one checker fire: the 13 plus gen_test_irq_basic_1207954461, which failed first on a property and
  carries fires further down its log. The two gen_test_irq_basic_red runs also contain fires, so SIXTEEN runs
  across the entry family fire at all. THE RATE IS NOT UNIFORM AND IS UNEXPLAINED:
  gen_test_irq_basic_1207954461 fires 258 times where the other fifteen fire between 1 and 17. That is a named
  fact for the checker-fix record. COUNT, AND A DISAGREEMENT NOW CLOSED. The fire count is 334 across those 16
  runs, 330 in the 14 gen_test_irq_basic runs and 4 in the 2 red runs. Method, the Test Writer's and re-
  derived here by the Runtime Manager rather than adopted: count lines matching "(order N) not taken within 17
  records (now order M" in each run's sim.log. An earlier Runtime Manager figure of 343 counted every line
  mentioning the id; the 9 extra are UVM end-of-simulation per-id tally lines of the form "[irq_entry]     6",
  which carry no delta and are not fires. Both counts were correct for what they counted and the fire count is
  334. One sub-count is corrected: the 330 fall in FOURTEEN gen_test_irq_basic runs, not thirteen. WHY THE
  TALLY LINE IS ABSENT FROM SEVEN OF THE SIXTEEN, measured rather than assumed. It was suggested that a UVM
  quit count cuts the report phase short. It does not: no log contains a quit-count line, and one of the seven
  fires only once, which no quit count would reach. The discriminator is simpler and exact: the seven runs
  missing the tally have NO "UVM Report Summary" section at all, and the nine that carry a tally all have one.
  The run ended before the report phase emitted its summary. So a reader counting tally lines would
  UNDERCOUNT, missing seven runs entirely including the 258-fire outlier, which is why the fire count above is
  taken from the fire lines and not from the tallies. RETENTION GAP, recorded as the Runtime Manager's own.
  These runs retain NOTHING per-record: every result.yaml records export_file null and export_rows_observed
  null and no run directory holds a trace file, because the export sink was never enabled by its plusarg
  (gen_tb_pkg.sv:36). A run that fires a checker sixteen times in forty and keeps no record stream forces
  every investigation to reconstruct arithmetic from message text; it cost the Test Writer a program count and
  tb-infra-2 two exchanges on this item. The flow change, defaulting the export on for measured entries or at
  least for entries carrying a fire check, is on the Runtime Manager's list.
  3 runs: sva_rvfi_irq_valid_exclusive ONLY. Already ruled at this very commit: the committed ruling says the
  property fires legitimately and the PROPERTY must change, not the stimulus, and the property has not changed
  since. A known-wrong property, not a new finding.
  2 runs: the ruled property PLUS three UNRULED ibus properties (sva_ibus_gnt_only_with_req,
  sva_ibus_outstanding_max, sva_ibus_rvalid_outstanding). The ruled one fires first and the ibus ones tens of
  MICROseconds later: 47.73 us in gen_test_irq_basic_165313640 and 26.59 us in gen_test_irq_basic_1207954461,
  at 10 ps ticks. NOT called a cascade and NOT called independent: an unruled signature that appears only in
  runs where the ruled one also fired. For rtl-arch and tb-infra-2.
  1 run: a HARNESS timeout, classified and named. Run directory
  /proj_soc/user_dev/fzhang/ibex_dv_out/regress_wave_4017573/runs/gen_test_irq_basic_1800473338. The failure is
  "GEN_TEST: stimulus() did not finish after the end of test (SimTimeoutError)" at gen_test_template.py:482,
  with zero UVM errors, finish seen, no pass marker, and a simulation that ran to 1123735 ns against a typical
  65420 ns. A fixed cocotb timeout in the stimulus path at this seed: seed-dependent harness, not a design
  finding, and the class that can kill a measured round.
