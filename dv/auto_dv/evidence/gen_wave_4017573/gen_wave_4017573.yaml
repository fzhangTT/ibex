the_fixes_hold_on_unseen_draws: >
  bit_ratified and cmp_zca are 40 of 40 PASS with every declared bin hit at every seed, on seeds sharing nothing
  with the sweep that measured the fixes. csr_warl produced a program at ALL FORTY seeds, so the Test Writer's
  backstop closes the generator-assert class and the entry's provisional status clears on that criterion.
cross_legs: >
  Per the cross-operand rule, cross legs are reported by leg. Declared cross legs per entry: bit_ratified 494 all
  at every seed, cmp_zca 201 all at every seed, cmp_zcmp_basic 240 with 5 below, mul_mul 289 with 2 below,
  mul_div 139 with 5 below, isa_shift 89 with 4 below, csr_warl 91 with 1 below, cmp_zcb 61 with 6 below,
  rst_boot 0. OBSERVATION WORTH THE DV LEAD'S RULE: of the 28 declared bins under the every-seed bar across the
  whole wave, 24 are CROSS LEGS. The fragility is concentrated in crosses, which is what the rule predicts.
bins_no_reader_could_examine: >
  gen_test_irq_basic and gen_test_irq_basic_red declare no bins at all (unmeasured entries with a null
  fcov_expectation_file), so nothing can be placed under the every-seed bar for them and NO MAPPER EXISTS FOR
  THESE GENERATORS. For the nine entries with manifests, the inline check covers every declared bin, so the
  under-bar count and the examined count coincide and no separate unexamined count arises.
irq_entry_real_failures: >
  19 of 40, on mechanisms rather than coverage, kept separate because they have different owners.
  13 runs: the irq_entry CHECKER fires (gen_checkers_pkg.sv:133), "lines 00001 raised at cycle 44238 (order
  1381) not taken within 17 records (now order 1400, mie 7fff0888 mstatus 00000088)". mie bit 0 is clear while
  the raised line is bit 0, so the checker requires a line the enable mask does not enable to be taken. Reads as
  checker-versus-stimulus; the classification is the Test Writer's and tb-infra-2's.
  3 runs: sva_rvfi_irq_valid_exclusive ONLY. Already ruled at this very commit: the committed ruling says the
  property fires legitimately and the PROPERTY must change, not the stimulus, and the property has not changed
  since. A known-wrong property, not a new finding.
  2 runs: the ruled property PLUS three UNRULED ibus properties (sva_ibus_gnt_only_with_req,
  sva_ibus_outstanding_max, sva_ibus_rvalid_outstanding). The ruled one fires first and the ibus ones tens of
  MICROseconds later: 47.73 us in gen_test_irq_basic_165313640 and 26.59 us in gen_test_irq_basic_1207954461,
  at 10 ps ticks. NOT called a cascade and NOT called independent: an unruled signature that appears only in
  runs where the ruled one also fired. For rtl-arch and tb-infra-2.
  1 run: a HARNESS timeout, classified and named. Run directory
  /proj_soc/user_dev/fzhang/ibex_dv_out/regress_wave_4017573/runs/gen_test_irq_basic_1800473338. The failure is
  "GEN_TEST: stimulus() did not finish after the end of test (SimTimeoutError)" at gen_test_template.py:482,
  with zero UVM errors, finish seen, no pass marker, and a simulation that ran to 1123735 ns against a typical
  65420 ns. A fixed cocotb timeout in the stimulus path at this seed: seed-dependent harness, not a design
  finding, and the class that can kill a measured round.
red_fixture: >
  RED-OK at 1 of 3. The other two failed "for an undeclared reason" and the reason is the SAME irq_entry checker
  fire, so the fixture's designed failure is MASKED rather than absent. This is the failure the Test Writer said
  it most wanted surfaced if it existed.
not_hit_stimulus_shapes: >
  The 46 stimulus-class not_hit lines of the two manifests, measured per seed from each run's own report because
  they are undeclared and no coverage check mentions them. 23 of bit_ratified's 24 and 21 of cmp_zca's 22 are hit
  at EVERY one of the forty seeds, so the re-render may declare those 44. The two that are never hit are
  gen_bit_sbit_cg.cp_binv_twice.yes and gen_cmp_imm_edges_cg.cp_cj_off.self. This reproduces the Critic's
  measurement independently, by a different route and on different seeds, and names the same two.
binv_pair_not_measured_here: >
  The wave was NOT re-pinned for the Test Writer's binv-pair fix, on the Orchestrator's ruling and the Test
  Writer's recommendation: it buys one bin and costs 400 runs plus a round-2 delay. cp_binv_twice.yes is
  therefore 0 of 40 here BY CONSTRUCTION and is measured by the separate post-fix block instead.
